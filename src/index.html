<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <title>FitFlow — Fitness & Nutrition</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0e13">
  <script>
    // Apply the saved theme before first paint (mirrors ThemeService).
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('fitflow.v1') || 'null');
        var t = (s && s.settings && s.settings.theme) || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var k = s && s.settings && s.settings.skin;
        if (k) document.documentElement.setAttribute('data-skin', k);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
